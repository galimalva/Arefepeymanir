<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta name="description" content="فرم تماس با معصومه (عارفه) پیمان — ارسال پیام برای همکاری، نقد و پیشنهاد.">
  <meta name="robots" content="index, follow">
  <meta name="theme-color" content="#2F6BFF">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='16' fill='%232F6BFF'/%3E%3Ctext x='16' y='23' font-size='18' text-anchor='middle' fill='white' font-family='Tahoma'%3Em%3C/text%3E%3C/svg%3E">
  <meta property="og:type" content="website">
  <meta property="og:locale" content="fa_IR">
  <meta property="og:title" content="تماس با ما | معصومه (عارفه) پیمان">
  <link rel="stylesheet" href="assets/css/style.css?v=18">
<link rel="canonical" href="https://example.com/contact.html">
  <meta property="og:url" content="https://example.com/contact.html">

  <meta name="twitter:card" content="summary_large_image">
</head>
<body data-page="contact">
  <header id="site-header"></header>

  <main>
    <section class="page-hero">
      <div class="container">
        <h1 class="display-1">تماس با ما</h1>
        <p class="lead">پیام شما مستقیماً به دست نویسنده می‌رسد.</p>
      </div>
    </section>

    <section class="section" aria-label="فرم تماس">
      <div class="container-narrow">
        <form id="contact-form" class="contact-form" novalidate>
          <h2 class="section-title">ارسال پیام</h2>
          <div class="form-grid">
            <div class="form-group">
              <label for="ct-name">نام *</label>
              <input class="form-control" id="ct-name" name="name" autocomplete="name" required>
              <span class="field-error" id="ct-name-error"></span>
            </div>
            <div class="form-group">
              <label for="ct-email">ایمیل *</label>
              <input class="form-control" id="ct-email" name="email" type="email" dir="ltr" autocomplete="email" required>
              <span class="field-error" id="ct-email-error"></span>
            </div>
            <div class="form-group form-group--full">
              <label for="ct-subject">موضوع (اختیاری)</label>
              <input class="form-control" id="ct-subject" name="subject">
              <span class="field-error" id="ct-subject-error"></span>
            </div>
            <div class="form-group form-group--full">
              <label for="ct-message">متن پیام *</label>
              <textarea class="form-control" id="ct-message" name="message" rows="5" required></textarea>
              <span class="field-error" id="ct-message-error"></span>
            </div>
          </div>
          <p class="form-note">پیام شما مستقیماً به دست نویسنده می‌رسد و در اسرع وقت پاسخ داده می‌شود.</p>
          <div class="form-actions">
            <button class="btn btn-primary btn-lg" id="ct-submit" type="submit">ارسال پیام</button>
          </div>
        </form>
      </div>
    </section>

  </main>

  <footer id="site-footer"></footer>

  <script type="module" src="assets/js/main.js"></script>
  <script type="module" src="assets/js/pages/contact.js"></script>
</body>
</html>
