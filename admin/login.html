<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <script src="../assets/js/vendor/supabase-js.min.js"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ورود به پنل مدیریت</title>
  <link rel="stylesheet" href="../assets/css/style.css?v=18">
</head>
<body data-page="login" data-admin="true">
  <header id="site-header"></header>
  <main>
    <section class="container" aria-label="ورود مدیر">
      <form id="login-form" class="login-form" novalidate>
        <h1 class="section-title">ورود به پنل مدیریت</h1>
        <div class="page-error" id="login-error" hidden></div>
        <div class="form-grid">
          <div class="form-group form-group--full">
            <label for="lg-email">ایمیل *</label>
            <input class="form-control" id="lg-email" name="email" type="email" autocomplete="username" required>
            <span class="field-error" id="lg-email-error"></span>
          </div>
          <div class="form-group form-group--full">
            <label for="lg-password">رمز عبور *</label>
            <input class="form-control" id="lg-password" name="password" type="password" autocomplete="current-password" required>
            <span class="field-error" id="lg-password-error"></span>
          </div>
        </div>
        <div class="form-actions">
          <button class="btn btn-primary" id="lg-submit" type="submit">ورود</button>
        </div>
      </form>
    </section>
  </main>
  <footer id="site-footer"></footer>
  <script type="module" src="../assets/js/main.js"></script>
  <script type="module" src="../assets/js/admin/login.js"></script>
</body>
</html>
