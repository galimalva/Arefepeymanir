<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <script src="../assets/js/vendor/supabase-js.min.js"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>پنل مدیریت | نظرات</title>
  <link rel="stylesheet" href="../assets/css/style.css?v=18">
</head>
<body data-page="admin-comments" data-admin="true">
  <header id="site-header"></header>

  <main>
    <section class="admin-panel" aria-label="مدیریت نظرات">
      <div class="container">
        <div class="admin-head">
          <h1 class="section-title">نظرات خوانندگان</h1>
          <div class="toolbar-row">
            <select id="aStatus" class="form-control" aria-label="فیلتر وضعیت نظر">
              <option value="">همه</option>
              <option value="pending">در انتظار تأیید</option>
              <option value="approved">تأیید شده</option>
            </select>
            <input id="aSearch" class="form-control" type="search" placeholder="جستجوی نام یا متن…" aria-label="جستجوی دیدگاه">
            <button id="aRefresh" class="btn btn-secondary">بازخوانی</button>
          </div>
        </div>
        <div id="aTable"><p class="section-empty">در حال بارگذاری…</p></div>
      </div>
    </section>
  </main>

  <footer id="site-footer"></footer>

  <script type="module" src="../assets/js/main.js"></script>
  <script type="module" src="../assets/js/admin/comments.js"></script>
</body>
</html>
