  <meta name="robots" content="index, follow">
  <meta name="theme-color" content="#2F6BFF">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='16' fill='%232F6BFF'/%3E%3Ctext x='16' y='23' font-size='18' text-anchor='middle' fill='white' font-family='Tahoma'%3Em%3C/text%3E%3C/svg%3E">
  <meta property="og:type" content="website">
  <meta property="og:locale" content="fa_IR">
  <meta property="og:title" content="گالری نقاشی | معصومه (عارفه) پیمان">

<link rel="canonical" href="https://example.com/gallery.html">

<body data-page="gallery">
  <header id="site-header"></header>

  <main>
    <section class="page-hero">
      <div class="container">
        <h1 class="display-1">گالری نقاشی</h1>
        <p class="lead">مروری بر آثار هنری — فیلتر بر اساس دسته و مجموعه، مشاهده با لایت‌باکس و صفحه اختصاصی هر اثر.</p>
      </div>
    </section>

    <section class="section" aria-label="گالری آثار">
      <div class="container">
        <div class="list-tools" id="gallery-toolbar">
          <form id="gallery-search" class="search-form" role="search" aria-label="فیلتر آثار">
            <select class="form-control" name="category" id="fCategory" aria-label="فیلتر دسته">
              <option value="">همه دسته‌ها</option>
              <option value="abstract">انتزاعی</option>
              <option value="calligraphy">خوشنویسی</option>
              <option value="traditional">سنتی</option>
              <option value="portrait">چهره</option>
              <option value="landscape">منظره</option>
              <option value="still_life">طبیعت بی‌جان</option>
              <option value="figurative">تجسمی</option>
              <option value="floral">گل و گیاه</option>
              <option value="other">سایر</option>
            </select>
            <span id="fCollectionWrap">
              <select class="form-control" name="collection" id="fCollection" aria-label="فیلتر مجموعه">
                <option value="">همه مجموعه‌ها</option>
              </select>
            </span>
            <input type="hidden" name="page" value="1">
            <button class="btn btn-primary" type="submit">اعمال فیلتر</button>
          </form>
        </div>

        <div class="gallery-tiles" id="gallery-grid" aria-live="polite">
          <p class="section-empty"></p>
        </div>

        <nav class="pagination" id="gallery-pagination" aria-label="صفحه‌بندی"></nav>
      </div>
    </section>

  </main>

  <footer id="site-footer"></footer>

  <script type="module" src="assets/js/main.js"></script>
  <script type="module" src="assets/js/pages/gallery.js"></script>
</body>
</html>
